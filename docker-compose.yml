services:
  # ==========================================
  # Database: PostgreSQL 16
  # ==========================================
  db:
    image: postgres:16
    container_name: bara-sense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-home_automation}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Port 5432 hanya di-expose ke host jika diperlukan (misal debugging / backup)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-home_automation}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bara-network

  # ==========================================
  # Application: Go Backend + React Frontend
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bara-sense-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - TZ=Asia/Jakarta
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bara-network

  # ==========================================
  # Optional: Cloudflare Tunnel (Tunnel Daemon)
  # Jalankan jika Anda mengonfigurasi token di .env
  # ==========================================
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: bara-sense-tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - app
  #   networks:
  #     - bara-network

volumes:
  pgdata:
    driver: local

networks:
  bara-network:
    driver: bridge
