name: CI/CD Auto Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_KEY: ${{ secrets.TUYA_ACCESS_KEY }}
          TUYA_ENDPOINT: ${{ secrets.TUYA_ENDPOINT }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          PORT: ${{ secrets.PORT }}
        with:
          host: 157.15.124.192
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: TUYA_ACCESS_ID,TUYA_ACCESS_KEY,TUYA_ENDPOINT,POSTGRES_URL,PORT
          script_stop: true
          script: |
            mask() {
              local v=$1
              local l=${#v}
              if [ -z "$v" ]; then echo "(kosong)"; elif [ $l -le 4 ]; then echo "***"; else echo "${v:0:3}...${v: -3}"; fi
            }
            echo "--- Backend Environment Configuration ---"
            echo "TUYA_ACCESS_ID: $(mask "$TUYA_ACCESS_ID")"
            echo "TUYA_ACCESS_KEY: $(mask "$TUYA_ACCESS_KEY")"
            echo "TUYA_ENDPOINT: $(mask "$TUYA_ENDPOINT")"
            echo "POSTGRES_URL: $(mask "$POSTGRES_URL")"
            echo "PORT: $(mask "$PORT")"
            echo "-----------------------------------------"

            # Cari folder repositori git backend di server
            BACKEND_REPO=$(find /root /opt /var/www /home -maxdepth 4 -name ".git" -type d 2>/dev/null | while read gitdir; do
              if grep -q "bara-sense-backend" "$gitdir/config"; then
                dirname "$gitdir"
                break
              fi
            done)
            
            if [ -n "$BACKEND_REPO" ]; then
              echo "Menemukan repositori backend di $BACKEND_REPO"
              echo "TUYA_ACCESS_ID=$TUYA_ACCESS_ID" > "$BACKEND_REPO/.env"
              echo "TUYA_ACCESS_KEY=$TUYA_ACCESS_KEY" >> "$BACKEND_REPO/.env"
              echo "TUYA_ENDPOINT=$TUYA_ENDPOINT" >> "$BACKEND_REPO/.env"
              echo "POSTGRES_URL=$POSTGRES_URL" >> "$BACKEND_REPO/.env"
              echo "PORT=$PORT" >> "$BACKEND_REPO/.env"
              echo "Berhasil mengupdate .env di $BACKEND_REPO"
            else
              echo "PERINGATAN: Repositori backend tidak ditemukan, .env gagal diperbarui!"
            fi
            
            # Tetap export ke current session
            export TUYA_ACCESS_ID=$TUYA_ACCESS_ID
            export TUYA_ACCESS_KEY=$TUYA_ACCESS_KEY
            export TUYA_ENDPOINT=$TUYA_ENDPOINT
            export POSTGRES_URL=$POSTGRES_URL
            export PORT=$PORT
            
            /usr/bin/bash /opt/deploy-backend.sh
